# Content for the home page (_pages/about.html). Edit freely; no code changes needed.

hero:
  eyebrow: "Azar Kazemi, PhD · Medical Informatics"
  headline: "AI for Medicine"
  headline_accent: "From Clinical Data to Computational Pathology"
  intro: >-
    I build and evaluate machine-learning methods that turn whole-slide images and
    biomedical data into reliable clinical evidence, from pathology foundation
    models to reproducible data workflows in clinical routine.
  buttons:
    - label: "Publications"
      url: "/publications/"
      style: primary
    - label: "CV"
      url: "/cv/"
      style: secondary

# Citation numbers are not computed automatically. Source: OpenAlex, 2026-11-26.
# Replace with your Google Scholar numbers whenever you like.
stats:
  citations: 453
  h_index: 9
  source: "OpenAlex"

# Each theme counts the entries in _data/all_publications.yml that list its id under `themes:`.
themes:
  - id: computational-pathology
    title: "Computational Pathology & Foundation Models"
    icon: "fas fa-microscope"
    color: "#4b3fb5"
    text: >-
      Benchmarking and ensembling pathology foundation models for subtyping, cancer
      detection, tumor classification and virtual staining on real-world cohorts.
  - id: digital-pathology
    title: "Digital Pathology in Clinical Routine"
    icon: "fas fa-hospital"
    color: "#1f8a8a"
    text: >-
      Bringing digital pathology into everyday diagnostics: workflow validation,
      inter-observer agreement and reproducible, high-quality datasets.
  - id: clinical-ml
    title: "Machine Learning for Clinical Prediction"
    icon: "fas fa-chart-line"
    color: "#2f6fd0"
    text: >-
      Interpretable prediction models for patient outcomes, from liver-transplant
      and burn survival to COVID-19 intensive-care triage and diabetes risk.
  - id: digital-health
    title: "Digital Health & Clinical Research"
    icon: "fas fa-mobile-alt"
    color: "#c2410c"
    text: >-
      Defining digital health, horizon scanning of mHealth technologies, e-learning
      and clinical studies on medication adherence and patient care.

